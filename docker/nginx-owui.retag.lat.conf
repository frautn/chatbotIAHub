server {
    server_name owui.retag.lat;
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long-running streamed LLM responses
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    listen 443 ssl;
    ssl_certificate /etc/ssl/certs/domain.cert.pem;
    ssl_certificate_key /etc/ssl/private/private.key.pem;

    access_log /var/log/nginx/owui.access.log;
    error_log  /var/log/nginx/owui.error.log;
}

server {
    listen 80;
    listen [::]:80;
    server_name owui.retag.lat;
    return 301 https://$host$request_uri;
}
