server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pg.retag.lat;
    client_max_body_size 100M;

    # The certificate must cover pg.retag.lat.
    ssl_certificate /etc/ssl/certs/domain.cert.pem;
    ssl_certificate_key /etc/ssl/private/private.key.pem;

    # Create this file before enabling the site; keep CloudBeaver login enabled too.
    auth_basic "Database administration";
    auth_basic_user_file /etc/nginx/cloudbeaver.htpasswd;

    location / {
        # Match CLOUDBEAVER_PORT if it differs from the default.
        proxy_pass http://127.0.0.1:8978;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support WebSocket connections and long-running database operations.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/pg.access.log;
    error_log /var/log/nginx/pg.error.log;
}

server {
    listen 80;
    listen [::]:80;
    server_name pg.retag.lat;
    return 301 https://pg.retag.lat$request_uri;
}
