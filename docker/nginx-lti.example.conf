# Public host for the Moodle LTI tool. Replace chat.example.com and the
# certificate paths. LTI_PUBLIC_URL must equal https://<server_name>.
server {
    server_name chat.example.com;
    client_max_body_size 100M;

    listen 443 ssl;
    ssl_certificate /etc/ssl/certs/domain.cert.pem;
    ssl_certificate_key /etc/ssl/private/private.key.pem;

    access_log /var/log/nginx/lti.access.log;
    error_log  /var/log/nginx/lti.error.log;

    # LTI protocol endpoints and health check.
    location /lti/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Score API for backend callers only; not exposed publicly.
    location /api/scores {
        return 404;
    }

    location = /_lti_auth {
        internal;
        proxy_pass http://127.0.0.1:8090/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @launch_required {
        default_type text/plain;
        return 401 "Open this activity from Moodle.\n";
    }

    # Everything else is Open WebUI, reachable only with a valid LTI session.
    location / {
        auth_request /_lti_auth;
        error_page 401 = @launch_required;
        auth_request_set $lti_email $upstream_http_x_lti_email;
        auth_request_set $lti_name  $upstream_http_x_lti_name;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Always overwritten, so clients cannot spoof the trusted identity.
        proxy_set_header X-Forwarded-Email $lti_email;
        proxy_set_header X-Forwarded-Name $lti_name;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;
    return 301 https://$host$request_uri;
}
