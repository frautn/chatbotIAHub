# Public host for a legacy LTI 1.1 "External Tool" in Moodle (or another
# LMS). Replace chat11.example.com and the certificate paths. LTI11_PUBLIC_URL
# must equal https://<server_name>. Reuses the same open-webui-lti backend as
# nginx-lti.example.conf (port 3001), just via a different gateway/port (8091)
# and a separate SSO cookie, so LTI 1.1 and LTI 1.3 launches run in parallel.
server {
    server_name chat11.example.com;
    client_max_body_size 100M;

    listen 443 ssl;
    ssl_certificate /etc/ssl/certs/domain.cert.pem;
    ssl_certificate_key /etc/ssl/private/private.key.pem;

    access_log /var/log/nginx/lti11.access.log;
    error_log  /var/log/nginx/lti11.error.log;

    # LTI protocol endpoints and health check.
    location /lti11/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Score API for backend callers only; not exposed publicly.
    location /api/scores {
        return 404;
    }

    location = /_lti11_auth {
        internal;
        proxy_pass http://127.0.0.1:8091/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @launch_required {
        default_type text/plain;
        return 401 "Open this activity from Moodle.\n";
    }

    # Everything else is Open WebUI, reachable only with a valid LTI session.
    location / {
        auth_request /_lti11_auth;
        error_page 401 = @launch_required;
        auth_request_set $lti_email $upstream_http_x_lti_email;
        auth_request_set $lti_name  $upstream_http_x_lti_name;
        auth_request_set $lti_group $upstream_http_x_lti_group;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Always overwritten, so clients cannot spoof the trusted identity.
        proxy_set_header X-Forwarded-Email $lti_email;
        proxy_set_header X-Forwarded-Name $lti_name;
        proxy_set_header X-Forwarded-Groups $lti_group;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name chat11.example.com;
    return 301 https://$host$request_uri;
}
