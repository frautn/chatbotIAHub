name: lti-gateway

services:
  lti-gateway:
    build:
      context: ../gateway
    image: chatbotiahub-lti-gateway:latest
    container_name: lti-gateway
    ports:
      - "127.0.0.1:${LTI_GATEWAY_PORT:-8090}:8090"
    environment:
      GATEWAY_SECRET_KEY: "${LTI_GATEWAY_SECRET_KEY:?Set LTI_GATEWAY_SECRET_KEY}"
      GATEWAY_PUBLIC_URL: "${LTI_PUBLIC_URL:?Set LTI_PUBLIC_URL, e.g. https://chat.example.com}"
      GATEWAY_API_TOKEN: "${LTI_GATEWAY_API_TOKEN:-}"
      GATEWAY_SESSION_TTL: "${LTI_SESSION_TTL:-28800}"
      GATEWAY_USER_EMAIL_DOMAIN: "${LTI_USER_EMAIL_DOMAIN:-lti.invalid}"
      GATEWAY_STUDENT_GROUP: "${LTI_STUDENT_GROUP:-estudiantes}"
      GATEWAY_MODELS: "${LTI_GATEWAY_MODELS:-}"
      GATEWAY_ADMIN_ENABLED: "${LTI_ADMIN_ENABLED:-false}"
      GATEWAY_ADMIN_PUBLIC_URL: "${LTI_ADMIN_PUBLIC_URL:-https://owui.fcr.lat}"
      GATEWAY_ADMIN_EMAIL: "${LTI_ADMIN_EMAIL:-}"
      GATEWAY_ADMIN_PASSWORD: "${LTI_ADMIN_PASSWORD:-}"
      # Lets the gateway resume a learner's previous chat on relaunch; reaches
      # open-webui-lti directly (bypassing nginx) using the service name below.
      GATEWAY_WEBUI_INTERNAL_URL: "${LTI_GATEWAY_WEBUI_INTERNAL_URL:-http://open-webui-lti:8080}"
    volumes:
      - lti-gateway-data:/data
    restart: unless-stopped

  # LTI 1.1 gateway, for platforms/activities still using the legacy Basic
  # Launch + Basic Outcomes protocol. Runs alongside lti-gateway (LTI 1.3) and
  # shares the same student-facing open-webui-lti instance/group below.
  lti11-gateway:
    build:
      context: ../gateway
    image: chatbotiahub-lti-gateway:latest
    container_name: lti11-gateway
    command: ["gunicorn", "--bind", "0.0.0.0:8090", "--workers", "2", "lti_gateway.lti11.app:create_app()"]
    ports:
      - "127.0.0.1:${LTI11_GATEWAY_PORT:-8091}:8090"
    environment:
      GATEWAY_SECRET_KEY: "${LTI11_GATEWAY_SECRET_KEY:?Set LTI11_GATEWAY_SECRET_KEY}"
      GATEWAY_PUBLIC_URL: "${LTI11_PUBLIC_URL:?Set LTI11_PUBLIC_URL, e.g. https://chat11.example.com}"
      GATEWAY_API_TOKEN: "${LTI11_GATEWAY_API_TOKEN:-}"
      GATEWAY_SESSION_TTL: "${LTI11_SESSION_TTL:-28800}"
      GATEWAY_USER_EMAIL_DOMAIN: "${LTI11_USER_EMAIL_DOMAIN:-lti.invalid}"
      GATEWAY_STUDENT_GROUP: "${LTI11_STUDENT_GROUP:-estudiantes}"
      GATEWAY_MODELS: "${LTI11_GATEWAY_MODELS:-}"
      # Lets the gateway resume a learner's previous chat on relaunch; reaches
      # open-webui-lti directly (bypassing nginx) using the service name below.
      GATEWAY_WEBUI_INTERNAL_URL: "${LTI11_GATEWAY_WEBUI_INTERNAL_URL:-http://open-webui-lti:8080}"
    volumes:
      - lti11-gateway-data:/data
    restart: unless-stopped

  # Student-facing Open WebUI. It trusts identity headers, so it must only be
  # reachable through the nginx auth_request front end (bound to localhost).
  open-webui-lti:
    image: "${OPENWEBUI_IMAGE_LTI:-ghcr.io/open-webui/open-webui:main}"
    container_name: openwebui-lti
    ports:
      - "127.0.0.1:${LTI_WEBUI_PORT:-3001}:8080"
    environment:
      DEFAULT_LOCALE: "${DEFAULT_LOCALE:-es-ES}"
      DEFAULT_INTERFACE_SETTINGS: "${DEFAULT_INTERFACE_SETTINGS:-{\"language\": \"es-ES\", \"title\": {\"auto\": false}, \"autoFollowUps\": false, \"autoTags\": false}}"
      ENABLE_TITLE_GENERATION: "False"
      ENABLE_FOLLOW_UP_GENERATION: "False"
      ENABLE_TAGS_GENERATION: "False"
      DATABASE_URL: "${DATABASE_URL:-postgresql://webui_user:some_strong_password@host.docker.internal:5432/webui_db}"
      OPENAI_API_BASE_URL: "${OPENAI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:-}"
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: "X-Forwarded-Email"
      WEBUI_AUTH_TRUSTED_NAME_HEADER: "X-Forwarded-Name"
      WEBUI_AUTH_TRUSTED_GROUPS_HEADER: "X-Forwarded-Groups"
      DEFAULT_USER_ROLE: "user"
      ENABLE_SIGNUP: "false"
      WEBUI_SESSION_COOKIE_SECURE: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - openwebui-shared-data:/app/backend/data
    restart: unless-stopped

volumes:
  lti-gateway-data:
  lti11-gateway-data:
  # Created and owned by docker-compose-openwebui.yml, which start.sh brings up first.
  openwebui-shared-data:
    external: true
    name: "${OPENWEBUI_DATA_VOLUME:-openwebui-for-moodle_openwebui-for-moodle-data}"
