# Dedicated admin host for the SAME open-webui-lti container as student tools.
# Replace the hostname/certificates and adjust ports if customized.
# LTI_ADMIN_PUBLIC_URL must equal https://<server_name>, and must NOT be
# the stock Open WebUI hostname or either student LTI hostname.
server {
    server_name lti-admin.fcr.lat;
    client_max_body_size 100M;

    listen 443 ssl;
    ssl_certificate /etc/ssl/certs/domain.cert.pem;
    ssl_certificate_key /etc/ssl/private/private.key.pem;

    location = /lti/admin/complete {
        limit_except POST { deny all; }
        client_max_body_size 2k;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie "";
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /lti/ {
        return 404;
    }

    # Only the gateway may create a trusted-header session, over Docker's
    # private network. Public requests authenticate using their issued token.
    location ~ ^/api/v1/auths/(signin|signup|ldap)(/|$) {
        return 404;
    }

    location = /api/scores {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Never supply a shared identity to unauthenticated browser requests.
        # No student auth_request: Open WebUI validates the admin bearer token.
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Forwarded-Name "";
        proxy_set_header X-Forwarded-Groups "";
        proxy_set_header X-Forwarded-Role "";

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name lti-admin.fcr.lat;
    return 301 https://$host$request_uri;
}
