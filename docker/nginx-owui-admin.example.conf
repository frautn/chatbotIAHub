# Install INSIDE the existing HTTPS server block for owui.fcr.lat.
# Leave its existing location / and Open WebUI password login unchanged.
# The LTI gateway must run on this nginx host, listening on loopback port 8090.
location = /lti/admin/complete {
    limit_except POST { deny all; }
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie "";
    proxy_hide_header X-Powered-By;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
}
